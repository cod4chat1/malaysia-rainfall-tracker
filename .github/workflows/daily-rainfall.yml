name: Daily rainfall update

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "recent or backfill"
        required: true
        default: "recent"
        type: choice
        options:
          - recent
          - backfill
          - smoke
      start_date:
        description: "Backfill start date (YYYY-MM-DD)"
        required: false
        type: string
      end_date:
        description: "Backfill end date (YYYY-MM-DD, maximum 366 days)"
        required: false
        type: string
      smoke_date:
        description: "Smoke-test date (YYYY-MM-DD)"
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: malaysia-rainfall-sheet
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
      RAINFALL_CALENDAR_START: "2013-01-01"
      RAINFALL_MAX_DATES_PER_RUN: "10"
      RAINFALL_MAX_DOWNLOAD_BYTES: "50000000"
      RAINFALL_MAX_TOTAL_DOWNLOAD_BYTES: "250000000"
      RAINFALL_MAX_SHEETS_REQUESTS: "50"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Scheduled or recent update
        id: recent_update
        if: github.event_name == 'schedule' || inputs.mode == 'recent'
        shell: bash
        run: |
          set -o pipefail
          python -m rainfall_tracker.cli run 2>&1 | tee rainfall-run.log
        env:
          PYTHONPATH: src
      - name: Historical backfill
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'backfill'
        run: >-
          python -m rainfall_tracker.cli backfill
          --start-date "${{ inputs.start_date }}"
          --end-date "${{ inputs.end_date }}"
        env:
          PYTHONPATH: src
      - name: No-write source smoke test
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'smoke'
        run: python -m rainfall_tracker.cli smoke --date "${{ inputs.smoke_date }}"
        env:
          PYTHONPATH: src
      - name: Send GitHub completion alert
        if: >-
          always() &&
          (github.event_name == 'schedule' || inputs.mode == 'recent')
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
        with:
          script: |
            const fs = require("fs");
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const succeeded = process.env.JOB_STATUS === "success";
            const icon = succeeded ? "[OK]" : "[FAILED]";
            const outcome = succeeded ? "completed successfully" : "failed";
            const runUrl =
              `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const sheetUrl =
              `https://docs.google.com/spreadsheets/d/${process.env.SPREADSHEET_ID}/edit`;
            const timestamp = new Intl.DateTimeFormat("en-CA", {
              timeZone: "Asia/Kuala_Lumpur",
              dateStyle: "medium",
              timeStyle: "short",
            }).format(new Date());

            let summary = null;
            if (fs.existsSync("rainfall-run.log")) {
              const lines = fs.readFileSync("rainfall-run.log", "utf8")
                .split(/\r?\n/)
                .reverse();
              for (const line of lines) {
                try {
                  const parsed = JSON.parse(line);
                  if (parsed && typeof parsed.processed_dates !== "undefined") {
                    summary = parsed;
                    break;
                  }
                } catch {
                  // Ignore ordinary non-JSON log lines.
                }
              }
            }

            const details = summary ? [
              `- Requested dates: ${summary.requested_dates ?? 0}`,
              `- Processed dates: ${summary.processed_dates ?? 0}`,
              `- Rows written: ${summary.records ?? 0}`,
              `- Source dates unavailable: ${summary.missing_dates ?? 0}`,
              `- Dates already current/skipped: ${summary.skipped_dates ?? 0}`,
            ] : ["- Run summary: unavailable; open the workflow for details"];

            const body = [
              `@${owner} The daily rainfall update **${outcome}**.`,
              "",
              `- Completed: ${timestamp} Malaysia time`,
              ...details,
              `- [Rainfall Google Sheet](${sheetUrl})`,
              `- [Workflow run](${runUrl})`,
            ].join("\n");

            const label = "daily-update-alerts";
            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: label,
                color: "1D76DB",
                description: "Automated daily rainfall tracker notifications",
              });
            }

            const existing = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              labels: label,
              per_page: 1,
            });
            if (existing.data.length) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.data[0].number,
                body: `${icon} ${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title: "Daily rainfall update alerts",
                body: `${icon} ${body}\n\nKeep this issue open and subscribed to receive alerts.`,
                labels: [label],
              });
            }
