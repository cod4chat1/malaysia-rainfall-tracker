name: Daily rainfall update

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "recent or backfill"
        required: true
        default: "recent"
        type: choice
        options:
          - recent
          - backfill
          - smoke
      start_date:
        description: "Backfill start date (YYYY-MM-DD)"
        required: false
        type: string
      end_date:
        description: "Backfill end date (YYYY-MM-DD, maximum 366 days)"
        required: false
        type: string
      smoke_date:
        description: "Smoke-test date (YYYY-MM-DD)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: malaysia-rainfall-sheet
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
      RAINFALL_CALENDAR_START: "2013-01-01"
      RAINFALL_MAX_DATES_PER_RUN: "10"
      RAINFALL_MAX_DOWNLOAD_BYTES: "50000000"
      RAINFALL_MAX_TOTAL_DOWNLOAD_BYTES: "250000000"
      RAINFALL_MAX_SHEETS_REQUESTS: "50"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Scheduled or recent update
        id: recent_update
        if: github.event_name == 'schedule' || inputs.mode == 'recent'
        shell: bash
        run: |
          set -o pipefail
          python -m rainfall_tracker.cli run 2>&1 | tee rainfall-run.log
        env:
          PYTHONPATH: src
      - name: Historical backfill
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'backfill'
        run: >-
          python -m rainfall_tracker.cli backfill
          --start-date "${{ inputs.start_date }}"
          --end-date "${{ inputs.end_date }}"
        env:
          PYTHONPATH: src
      - name: No-write source smoke test
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'smoke'
        run: python -m rainfall_tracker.cli smoke --date "${{ inputs.smoke_date }}"
        env:
          PYTHONPATH: src
      - name: Email daily update result
        if: >-
          always() &&
          (github.event_name == 'schedule' || inputs.mode == 'recent')
        continue-on-error: true
        run: >-
          python -m rainfall_tracker.notifications
          --status "${{ job.status }}"
          --summary rainfall-run.log
          --repository "${{ github.repository }}"
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          PYTHONPATH: src
          RAINFALL_EMAIL_FROM: ${{ secrets.RAINFALL_EMAIL_FROM }}
          RAINFALL_EMAIL_APP_PASSWORD: ${{ secrets.RAINFALL_EMAIL_APP_PASSWORD }}
          RAINFALL_EMAIL_TO: ${{ secrets.RAINFALL_EMAIL_TO }}
